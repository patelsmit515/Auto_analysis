<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auto_analysis — Local Data Analysis Application</title>
  <meta name="description" content="A clean, beginner-friendly local data analysis and SQL workspace." />
  <link rel="stylesheet" href="css/index.css" />
  <link rel="stylesheet" href="css/components.css" />
  <script src="vendor/chart.umd.min.js"></script>
</head>
<body>
  <div id="app-container">
    <!-- Left Sidebar Navigation -->
    <aside id="sidebar">
      <div class="brand-section">
        <div class="brand-logo">A</div>
        <div class="brand-title">Auto_analysis</div>
        <span class="brand-badge">v1.0</span>
      </div>

      <nav style="flex: 1; overflow-y: auto;">
        <ul class="nav-menu">
          <li>
            <a class="nav-item active" data-tab="dashboard">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="3" width="7" height="7"></rect>
                  <rect x="14" y="3" width="7" height="7"></rect>
                  <rect x="14" y="14" width="7" height="7"></rect>
                  <rect x="3" y="14" width="7" height="7"></rect>
                </svg>
              </span>
              <span class="nav-text">Dashboard</span>
            </a>
          </li>
          <li>
            <a class="nav-item" data-tab="import">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="17 8 12 3 7 8"></polyline>
                  <line x1="12" y1="3" x2="12" y2="15"></line>
                </svg>
              </span>
              <span class="nav-text">Import &amp; Inspect</span>
            </a>
          </li>
          <li>
            <a class="nav-item" data-tab="clean">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2v4"></path>
                  <path d="M12 18v4"></path>
                  <path d="M4.93 4.93l2.83 2.83"></path>
                  <path d="M16.24 16.24l2.83 2.83"></path>
                  <path d="M2 12h4"></path>
                  <path d="M18 12h4"></path>
                  <path d="M4.93 19.07l2.83-2.83"></path>
                  <path d="M16.24 7.76l2.83-2.83"></path>
                </svg>
              </span>
              <span class="nav-text">Clean &amp; Transform</span>
            </a>
          </li>
          <li>
            <a class="nav-item" data-tab="sql">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <ellipse cx="12" cy="5" rx="9" ry="3"></ellipse>
                  <path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"></path>
                  <path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"></path>
                </svg>
              </span>
              <span class="nav-text">SQL Analysis</span>
            </a>
          </li>
          <li>
            <a class="nav-item" data-tab="charts">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="20" x2="18" y2="10"></line>
                  <line x1="12" y1="20" x2="12" y2="4"></line>
                  <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
              </span>
              <span class="nav-text">Charts</span>
            </a>
          </li>
          <li>
            <a class="nav-item" data-tab="relationships">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
                  <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
                </svg>
              </span>
              <span class="nav-text">Relationships</span>
            </a>
          </li>
          <li>
            <a class="nav-item" data-tab="export">
              <span class="nav-icon">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                  <polyline points="7 10 12 15 17 10"></polyline>
                  <line x1="12" y1="15" x2="12" y2="3"></line>
                </svg>
              </span>
              <span class="nav-text">Export Data</span>
            </a>
          </li>
        </ul>
      </nav>

      <!-- Sidebar Footer with Connection Status -->
      <div class="sidebar-footer">
        <div class="system-status">
          <div class="status-dot" id="backend-status-dot"></div>
          <span id="backend-status-text">Connecting...</span>
        </div>
        <span style="font-size: 11px; color: var(--text-light);">Localhost</span>
      </div>
    </aside>

    <!-- Main Workspace -->
    <main id="workspace">
      <!-- Top Header -->
      <header id="top-header">
        <div class="header-left">
          <div class="header-title-wrap">
            <h1 id="page-title">Dataset Dashboard</h1>
            <p id="page-subtitle">Overview of loaded data dimensions, statistics, and quality score</p>
          </div>
        </div>

        <div class="header-right" style="display: flex; align-items: center; gap: 10px;">
          <!-- Active Dataset Selector Bar -->
          <div class="dataset-picker-bar">
            <span class="dataset-picker-label">Active:</span>
            <select id="top-dataset-select" class="dataset-select" title="Switch active dataset for analysis">
              <option value="">No Datasets Loaded</option>
            </select>
          </div>

          <!-- Undo Button -->
          <button id="btn-top-undo" class="btn btn-outline btn-sm" title="Undo last change on active dataset" style="display: none; align-items: center; gap: 6px;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="1 4 1 10 7 10"></polyline>
              <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
            </svg>
            Undo
          </button>

          <!-- Theme Toggle -->
          <button id="theme-toggle" class="btn btn-outline btn-sm" title="Toggle Dark/Light Mode" aria-label="Toggle theme" style="display: flex; align-items: center; gap: 6px;">
            <span id="theme-toggle-icon">🌙</span>
            <span id="theme-toggle-text">Dark</span>
          </button>
        </div>
      </header>

      <!-- Content Views Container -->
      <div id="content-container">
        <!-- 1. Dashboard View -->
        <section id="view-dashboard" class="view-panel active"></section>

        <!-- 2. Import & Inspect View -->
        <section id="view-import" class="view-panel"></section>

        <!-- 3. Clean & Transform View -->
        <section id="view-clean" class="view-panel"></section>

        <!-- 4. SQL Analysis View -->
        <section id="view-sql" class="view-panel"></section>

        <!-- 5. Charts View -->
        <section id="view-charts" class="view-panel"></section>

        <!-- 6. Relationships View -->
        <section id="view-relationships" class="view-panel"></section>

        <!-- 7. Export Data View -->
        <section id="view-export" class="view-panel"></section>
      </div>
    </main>
  </div>

  <!-- Toast Notification Stack -->
  <div id="toast-container"></div>

  <!-- Application Logic -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
